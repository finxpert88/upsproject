    set(next){value=next==='dark'?'dark':'light';try{localStorage.setItem(key(),value)}catch{}paint()},
    toggle(){this.set(value==='light'?'dark':'light')},
    setIdentity(projectId,userId){project=projectId||'ups-project';user=userId||'local-user';value=read();paint()},
    reset(){this.set('light')},

function responseData(r){if(r?.kind==='error')throw Error(r.error?.message||'平台请求失败');return r?.data??r}

async function connect(){const api=adapter();state.requestSerial++;state.error='';resetData();if(!api||typeof api.getSession!=='function'||typeof api.listEquipment!=='function'){state.connection='unconnected';render();return}state.connection='connecting';render();const serial=state.requestSerial;try{const session=responseData(await api.getSession());if(serial!==state.requestSerial)return;if(!session||!Array.isArray(session.permissions))throw Error('会话能力响应不完整');state.session=session;window.ThemePreference.setIdentity(session.projectId,session.actorId);if(!permission('fleet.view')){state.connection='forbidden';render();return}const page=responseData(await api.listEquipment({pageSize:50,filter:{}}));if(serial!==state.requestSerial)return;if(!Array.isArray(page?.items))throw Error('设备列表响应缺少items');state.devices=page.items;state.connection='connected';state.eq=state.devices.find(d=>d.identity.commissioningStatus==='accepted')?.identity.equipRef||state.devices[0]?.identity.equipRef||'';if(state.eq)await loadSnapshot(state.eq);else render()}catch(e){if(serial===state.requestSerial){resetData();state.connection='error';state.error=e.message;render()}}}
async function loadSnapshot(eq){const serial=++state.requestSerial;state.eq=eq;state.snapshot=null;state.alarms=[];state.history=null;state.batteryObject='';if(!available('getSnapshot')){render();return}state.pending=true;render();try{const s=responseData(await adapter().getSnapshot({equipRef:eq}));if(serial!==state.requestSerial)return;if(s?.identity?.equipRef!==eq||!Array.isArray(s.metrics))throw Error('设备快照与请求不一致');state.snapshot=s;state.batteryObject=s.batteryAssets?.[0]?.objectRef||'';state.pending=false;render();if(available('listAlarms')&&permission('alarm.view')){const a=responseData(await adapter().listAlarms({view:'all',filter:{equipRefs:[eq]},pageSize:50}));if(serial===state.requestSerial){state.alarms=a.items||[];render()}}if(available('getHistory')&&permission('history.view'))await loadHistory(serial)}catch(e){if(serial===state.requestSerial){state.pending=false;state.error=e.message;render()}}}
async function loadHistory(serial=state.requestSerial){state.history=null;try{const h=responseData(await adapter().getHistory({equipRef:state.eq,objectRef:state.batteryObject||state.eq,fields:[state.historyMetric==='SOH'?'batterySoh':'batterySoc','loadPct']}));if(serial===state.requestSerial){state.history=h;render()}}catch(e){if(serial===state.requestSerial){state.history={error:e.message};render()}}}
function render(){const route=location.hash.slice(1).split('/');state.page=route[0]||'dashboard';$('#nav').innerHTML=[['dashboard','仪表盘'],['devices','设备清单'],['alarms','告警事件'],['reports','报表'],['config','工程']].map(([p,t])=>`<a href="#${p}" class="${state.page===p||(p==='config'&&['notifications','diagnostics','audit','commission'].includes(state.page))?'active':''}">${t}</a>`).join('');$('#connectionStatus').textContent={unconnected:'平台未接入',connecting:'正在读取平台会话',connected:'已连接平台',forbidden:'当前会话无查看权限',error:'平台连接失败'}[state.connection];if(state.connection==='forbidden'){ $('#app').innerHTML=empty('无查看权限','当前会话没有fleet.view能力。');return }
const engineering=['config','notifications','diagnostics','audit','commission'].includes(state.page)?`<div class="engineering-subnav">${[['config','工程配置'],['commission','接入验收'],['notifications','通知渠道'],['diagnostics','运行诊断'],['audit','审计']].map(([p,t])=>`<a href="#${p}" class="${p===state.page?'active':''}">${t}</a>`).join('')}</div>`:'';
$('#app').innerHTML=engineering+(state.error?notice(esc(state.error),'error'):'')+({dashboard,devices:devicePage,alarms:alarmPage,reports:reportPage,notifications:notificationPage,config:configPage,commission:commissionPage,diagnostics:diagnosticsPage,audit:auditPage,history:historyPage}[state.page]||dashboard)();decorateDictionary();}
function noService(method,text){return !available(method)?notice(text||'平台服务未接入，此操作当前不可用。'):''}
function devicePage(){const rows=readableDevices().filter(d=>(!state.query||(d.identity.name+' '+(d.identity.location||'')).includes(state.query))&&(!state.comm||d.communication===state.comm)&&(!state.power||d.powerMode===state.power));return pagehead('设备清单','按授权范围显示设备及当前数据。',btn('刷新','refresh'))+`<div class="panel"><div class="filters">${select('站点','site',[['','全部授权站点'],...siteOptions()],state.site)}${input('名称 / 位置','query',state.query,'search','maxlength="100"')}${select('通讯','comm',[['','全部'],...['online','offline','degraded','unknown'].map(v=>[v,labels[v]])],state.comm)}${select('供电模式','power',[['','全部'],...['utility','battery','staticBypass','maintenanceBypass','off','unknown'].map(v=>[v,labels[v]])],state.power)}</div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>设备 / 位置</th><th>通讯</th><th>供电</th><th>负载</th><th>续航</th><th>状态</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${btn(esc(d.identity.name),'device:'+d.identity.equipRef,'link')}<br><small>${esc(d.identity.location||'位置未登记')}</small></td><td>${badge(d.communication)}</td><td>${badge(d.powerMode)}</td><td>${metricDisplay(d.load)}</td><td>${metricDisplay(d.runtime)}</td><td>${badge(d.identity.commissioningStatus)}</td></tr>`).join('')}</tbody></table></div>`:empty(state.connection==='connected'?'没有符合条件的设备':'设备服务未接入','不会在无源数据时创建资产或补齐数值。')}</div>`}
function siteOptions(){return [...new Set(state.devices.map(d=>d.identity.siteRef))].map(ref=>[ref,ref])}

function metricDisplay(m){return m?.quality==='good'&&m.value!==null?esc(m.value)+' '+esc(m.unit||''):'—'}
function alarmPage(){const rows=state.alarms.filter(a=>(state.alarmView==='all'||a.activity==='active')&&(!state.ackFilter||a.acknowledgement===state.ackFilter));return pagehead('告警与事件','活动与确认状态分别显示。')+noService('listAlarms')+`<div class="panel"><div class="filters">${select('事件范围','alarmView',[['active','活动告警'],['all','全部事件']],state.alarmView)}${select('确认状态','ackFilter',[['','全部'],['unacknowledged','未确认'],['acknowledged','已确认'],['notRequired','无需确认']],state.ackFilter)}</div>${alarmTable(rows)}</div>`}
function alarmTable(rows){return rows.length?`<div class="tablewrap"><table><thead><tr><th>严重度</th><th>描述 / 设备</th><th>发生时间</th><th>活动状态</th><th>确认状态</th><th>操作</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${badge(a.severity)}</td><td>${esc(a.message||a.title||'未提供描述')}</td><td>${esc(a.occurredAt||'未知')}</td><td>${badge(a.activity)}</td><td>${badge(a.acknowledgement)}</td><td>${btn('详情','alarm:'+a.occurrenceId,'link')}</td></tr>`).join('')}</tbody></table></div>`:empty(available('listAlarms')?'无符合条件的事件':'告警数据未接入','源状态不可用时不显示零告警结论。')}
function historyPage(){return pagehead('历史趋势','源历史与当前值独立读取。',`<a href="#dashboard">返回仪表盘</a>`)+`<div class="panel"><div class="filters">${select('范围','historyRange',[['1h','最近1小时'],['24h','最近24小时'],['7d','最近7天']],state.historyRange)}${btn('查询','history','primary',!available('getHistory')||!permission('history.view'))}</div>${state.history?.error?notice(esc(state.history.error),'error'):''}${embeddedTrend('loadPct','负载趋势')}</div>`}

function dashboard(){const s=state.snapshot,i=identity(),assets=s?.batteryAssets||[],asset=assets.find(a=>a.objectRef===state.batteryObject)||assets[0],objectRef=asset?.objectRef;const mode=s?.powerMode?.quality==='good'?s.powerMode.value:'unknown',runtime=metricValue('runtimeEstimateMinutes'),q=metricValue('requiredRuntimeMinutes'),r=runtime?.quality==='good'?runtime.value:null,qv=q?.quality==='good'?q.value:null;const health=s?.healthIndicator,hm=health?.metric,validHealth=health?.availability==='available'&&hm?.quality==='good'&&Number.isFinite(hm.value)&&hm.value>=0&&hm.value<=100&&health.methodologyRef,healthValue=validHealth?hm.value:null;const load=metricValue('loadPct'),lv=load?.quality==='good'?load.value:null,cap=metricValue('capacitorHealthPct'),cv=cap?.quality==='good'?cap.value:null;const active=available('listAlarms')?state.alarms.filter(a=>a.kind==='alarm'&&a.activity==='active').length:null,unack=available('listAlarms')?state.alarms.filter(a=>a.kind==='alarm'&&a.acknowledgement==='unacknowledged').length:null;
